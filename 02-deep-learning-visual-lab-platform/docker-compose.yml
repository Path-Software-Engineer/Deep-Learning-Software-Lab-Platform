services:
  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    image: axon/deep-learning-visual-lab-api:1.0.0
    environment:
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/lab-app/Dockerfile
      args:
        API_PROXY_TARGET: http://api:8000
    image: axon/deep-learning-visual-lab-web:1.0.0
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/autoencoder').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
    restart: unless-stopped
