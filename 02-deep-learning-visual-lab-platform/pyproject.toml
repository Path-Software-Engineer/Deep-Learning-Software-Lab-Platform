[build-system]
requires = ["setuptools==75.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-learning-visual-lab-platform"
version = "1.0.0"
description = "Full-stack educational platform for inspecting neural-network representations."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.136.3",
  "pillow==10.4.0",
  "pydantic==2.13.4",
  "torch==2.9.0",
  "torchvision==0.24.0",
  "uvicorn==0.49.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.19.0",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.14",
]

[tool.setuptools.packages.find]
where = [
  "backend/api",
  "ai-services/neural-network-explainer/src",
  "ai-services/cnn-feature-map-viewer/src",
  "ai-services/autoencoder-latent-space/src",
]

[tool.pytest.ini_options]
testpaths = [
  "ai-services/neural-network-explainer/tests",
  "ai-services/cnn-feature-map-viewer/tests",
  "ai-services/autoencoder-latent-space/tests",
  "backend/api/tests",
  "tests",
]
pythonpath = [
  "ai-services/neural-network-explainer/src",
  "ai-services/cnn-feature-map-viewer/src",
  "ai-services/autoencoder-latent-space/src",
  "backend/api",
]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend/api;ai-services/neural-network-explainer/src;ai-services/cnn-feature-map-viewer/src;ai-services/autoencoder-latent-space/src"
files = [
  "backend/api/app",
  "ai-services/neural-network-explainer/src",
  "ai-services/cnn-feature-map-viewer/src",
  "ai-services/autoencoder-latent-space/src",
]
strict = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = [
  "app",
  "neural_network_explainer",
  "cnn_feature_map_viewer",
  "autoencoder_latent_space",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
